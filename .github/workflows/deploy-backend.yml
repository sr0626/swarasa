# THAT RUNS IT. See devops/CLAUDE.md guardrail: "NEVER build and deploy
# without the human having reviewed the workflow file itself first."
#
# Status as of 2026-09-15 (see that task's report for full detail):
# - backend/Dockerfile is Backend Dev's real FastAPI/Mangum image, not the
#   original DevOps placeholder — confirmed by reading the file directly.
# - Resource names below ("swarasa-api-dev" for both ECR_REPOSITORY and
#   LAMBDA_FUNCTION_NAME) are CONFIRMED, not assumed: read directly against
#   infra/modules/ecr and infra/modules/lambda, both of which name their
#   resources "${var.project}-${var.service_name}-${var.env}" with
#   project=swarasa, service_name=api (explicit in infra/main.tf's module
#   calls), env=dev — matching exactly.
# - infra/modules/iam/github_actions.tf's OIDC role (output
#   github_actions_role_arn) is CONFIRMED scoped to exactly what this
#   workflow needs: ECR push/pull + DescribeImages/DescribeImageScanFindings
#   on this one repo's ARN, lambda:UpdateFunctionCode + GetFunction on this
#   one function's ARN, ecr:GetAuthorizationToken on "*" (the one
#   AWS-mandated exception — that API has no resource-level permissions).
#   No AWS resources are provisioned yet, though (no `terraform apply` has
#   run) — this role does not exist in the account until a human runs that
#   apply and creates the GitHub secret below with the real output value.
#
# What still has to happen before this workflow can run for real (human
# actions, out of DevOps's scope — see this task's report for the full
# ordered checklist):
#   1. Human runs `terraform apply` (never this agent).
#   2. Human creates the GitHub secret DEV_DEPLOY_ROLE_ARN from
#      `terraform output github_actions_role_arn`.
#   3. Human does the one-time manual `:bootstrap` image push described in
#      infra/main.tf's `module "lambda"` comment, before the first apply can
#      even succeed (the Lambda resource requires an existing image).
# ============================================================================

name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"

permissions:
  id-token: write   # required for OIDC — no static AWS keys, ever
  contents: read

# One deploy at a time. Two merges landing minutes apart used to run two
# deploys concurrently; the second one's `update-function-code` on the
# deal-expiry Lambda then failed with ResourceConflictException (seen on
# Deploy Backend #72, PR #229 vs #230, 2026-09-24). `cancel-in-progress:
# false` queues instead of killing a run that is mid-deploy (a half-applied
# Lambda update is worse than waiting); GitHub keeps only the newest pending
# run, which is what we want since each run deploys its own commit's image
# and the latest commit should win.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1                  # confirmed — see DECISIONS.md "Region"
  ECR_REPOSITORY: swarasa-api-dev        # confirmed against infra/modules/ecr — see header
  LAMBDA_FUNCTION_NAME: swarasa-api-dev  # confirmed against infra/modules/lambda — see header
  # Added when deal_expiry moved from a zip placeholder to a container
  # image, REUSING this same image (infra/modules/lambda/main.tf's
  # aws_lambda_function.deal_expiry comment) instead of a second ECR
  # repo/pipeline — every push here now also has to move this function
  # onto the freshly built image, same as the API Lambda below.
  DEAL_EXPIRY_FUNCTION_NAME: swarasa-deal-expiry-dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC role assumption, no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Secret name confirmed against infra/modules/iam/outputs.tf's
          # github_actions_role_arn output description, which names this
          # exact secret. The role is defined in Terraform
          # (infra/modules/iam/github_actions.tf) but not yet applied to a
          # real account — a human must run `terraform apply` and then
          # create this GitHub secret with the real output ARN before this
          # workflow's first real run. See header comment for the full
          # post-apply checklist.
          role-to-assume: ${{ secrets.DEV_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Idempotency guard (devops/CLAUDE.md ALWAYS: "make the deploy step
      # idempotent — re-running the same workflow twice should be safe").
      # Infra's ECR module sets image_tag_mutability = "IMMUTABLE", so
      # re-pushing the same commit-SHA tag on a re-run would fail outright —
      # skip build/push if this tag was already pushed by an earlier run.
      - name: Check whether this commit's image was already pushed
        id: check-image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image (tagged with commit SHA, never :latest)
        if: steps.check-image.outputs.exists == 'false'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" backend/
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      # devops/CLAUDE.md ALWAYS: "scan images on push ... and stop the
      # pipeline on critical findings". Infra's ECR module sets
      # scan_on_push = true; this just waits for and enforces the result.
      #
      # Deliberately UNCONDITIONAL (not gated on check-image.outputs.exists,
      # unlike the build/push step above). If this step were skipped
      # whenever the image already exists, a run that pushed the image but
      # then failed/was interrupted before this step completed would, on
      # re-run, skip straight past the scan gate to deploying an image that
      # was never confirmed clean — silently defeating "stop the pipeline on
      # critical findings" via the exact idempotency path meant to make
      # re-runs safe. Re-checking an already-scanned image is cheap: the
      # waiter returns immediately once AWS's scan is complete, and
      # describe-image-scan-findings just returns the already-computed
      # result — so there's no cost to always enforcing it.
      #
      # Explicit start-image-scan added 2026-09-15: found live, in the
      # swarasa-dev account, that scan_on_push doesn't reliably
      # auto-trigger a scan the moment an image is pushed (confirmed:
      # both the very first :bootstrap push and this workflow's own first
      # real push sat at imageScanStatus=null for hours with no scan ever
      # starting on their own — not a brief propagation delay, genuinely
      # never triggered). Manually calling start-image-scan immediately
      # confirmed working (PENDING returned right away), so trigger it
      # explicitly rather than hoping scan_on_push fires — `|| true`
      # because a scan already running/complete (e.g. scan_on_push DID
      # fire, or this is a re-run) makes start-image-scan return an error
      # that's fine to ignore; the wait step below is the actual gate.
      - name: Start image scan (don't rely on scan_on_push alone — see comment)
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws ecr start-image-scan \
            --repository-name "$ECR_REPOSITORY" \
            --image-id imageTag="$IMAGE_TAG" || true

      - name: Wait for image scan, stop on critical findings
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws ecr wait image-scan-complete \
            --repository-name "$ECR_REPOSITORY" \
            --image-id imageTag="$IMAGE_TAG"
          CRITICAL=$(aws ecr describe-image-scan-findings \
            --repository-name "$ECR_REPOSITORY" \
            --image-id imageTag="$IMAGE_TAG" \
            --query 'imageScanFindings.findingSeverityCounts.CRITICAL' \
            --output text)
          if [ "$CRITICAL" != "None" ] && [ "$CRITICAL" -gt 0 ] 2>/dev/null; then
            echo "::error::$CRITICAL critical vulnerability finding(s) in image — aborting deploy."
            exit 1
          fi

      - name: Point Lambda at the new image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --image-uri "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Wait for the update to finish applying
        run: |
          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION_NAME"

      # deal_expiry runs the SAME image as the API Lambda (just a different
      # image_config.command — see infra/modules/lambda/main.tf's
      # aws_lambda_function.deal_expiry comment), so this same build gets
      # pushed onto it too. Deliberately unconditional (not gated on
      # check-image's output) the same way the scan steps above are: if a
      # prior run pushed the image and updated the API Lambda but was
      # interrupted before reaching here, a re-run must still be able to
      # bring deal_expiry into sync with the image the API Lambda is
      # already running.
      - name: Point deal-expiry Lambda at the same new image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws lambda update-function-code \
            --function-name "$DEAL_EXPIRY_FUNCTION_NAME" \
            --image-uri "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Wait for the deal-expiry update to finish applying
        run: |
          aws lambda wait function-updated \
            --function-name "$DEAL_EXPIRY_FUNCTION_NAME"
